<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A Little Something For You ❤️</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            background:
                linear-gradient(
                    135deg,
                    #fff5f7,
                    #fffaf2,
                    #f5f9ff
                );

            color: #4a4145;

        }


        .container {

            width: 100%;

            max-width: 420px;

            text-align: center;

        }


        .icon {

            font-size: 44px;

            margin-bottom: 12px;

            animation:
                float 3s ease-in-out infinite;

        }


        h1 {

            margin: 0;

            font-size: 30px;

            font-weight: 500;

        }


        .subtitle {

            margin-top: 10px;

            font-size: 15px;

            line-height: 1.6;

            color: #756a70;

        }


        .card {

            margin-top: 28px;

            padding: 32px 25px;

            background:
                rgba(255, 255, 255, 0.9);

            border-radius: 24px;

            box-shadow:
                0 15px 40px
                rgba(100, 80, 90, 0.12);

            min-height: 190px;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        #message {

            margin: 0;

            font-size: 21px;

            line-height: 1.7;

            animation:
                appear 0.8s ease;

        }


        .footer {

            margin-top: 28px;

            font-size: 13px;

            color: #9a8d93;

        }


        @keyframes float {

            0%, 100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-6px);

            }

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div
            class="icon"
            id="icon"
        >
            🌸
        </div>


        <h1 id="title">
            Loading...
        </h1>


        <div
            class="subtitle"
            id="subtitle"
        >
            Something special is waiting for you.
        </div>


        <div class="card">

            <p id="message">
                Loading your message...
            </p>

        </div>


        <div class="footer">
            A little corner made just for you ❤️
        </div>


    </div>



    <script>

        /*
        ==========================================
        DETERMINE WHICH QR WAS SCANNED
        ==========================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const type =
            params.get("type") || "pause";


        /*
        ==========================================
        SELECT THE CORRESPONDING JAVASCRIPT FILE
        ==========================================
        */

        const files = {

            pause: "pause.js",

            smile: "smile.js",

            reminder: "reminder.js",

            justbecause: "justbecause.js"

        };


        /*
        If an invalid type is provided,
        Little Pause will be used.
        */

        const selectedFile =
            files[type] || files.pause;


        /*
        ==========================================
        LOAD THE EXTERNAL JAVASCRIPT FILE
        ==========================================
        */

        const script =
            document.createElement("script");


        script.src = selectedFile;


        document.body.appendChild(script);

    </script>


</body>

</html>
